name: CI

# main에 Push하면 Development를 검증하고, v로 시작하는 Version Tag를 Push하면 Shipping 배포 파일을 생성한다.
# Actions 화면에서는 Debug, Development, Shipping 또는 전체 구성을 직접 선택해 실행할 수 있다.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Development
        type: choice
        options:
          - Debug
          - Development
          - Shipping
          - All

# 같은 Git Ref에서 새 실행이 시작되면 불필요해진 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 소스를 Checkout하고 Version Tag에서 GitHub Release를 생성할 수 있도록 Contents 쓰기 권한을 부여한다.
permissions:
  contents: write

jobs:
  build:
    # Version Tag는 항상 Shipping을 사용하고, 그 외에는 수동 선택값 또는 Development를 사용한다.
    name: Build ${{ github.ref_type == 'tag' && 'Shipping' || inputs.configuration || 'Development' }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BUILD_CONFIGURATION: ${{ github.ref_type == 'tag' && 'Shipping' || inputs.configuration || 'Development' }}

    steps:
      # Workflow를 실행한 Commit 또는 Tag의 소스를 Windows Runner로 가져온다.
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain 정의나 vcpkg Manifest가 바뀌지 않았다면 CMake, LLVM, vcpkg 다운로드와 Package Binary를 재사용한다.
      - name: Cache toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: |
            KnotEngine/Intermediate/Tools
            KnotEngine/Intermediate/Cache
          key: knot-windows-${{ hashFiles('Scripts/Toolchain.py', 'KnotEngine/Build/CMake/vcpkg.json') }}

      # 고정된 Toolchain과 의존성을 준비하고 Visual Studio 2022 프로젝트를 생성한다.
      - name: Generate projects
        shell: cmd
        run: GenerateProjects.bat --no-pause --no-open

      # Push 종류 또는 수동 입력에 따라 선택된 구성을 빌드한다.
      - name: Build
        shell: cmd
        run: BuildEngine.bat %BUILD_CONFIGURATION% --no-pause

      # Version Tag에서 생성한 실행 파일, DLL과 Content를 PDB 없이 하나의 ZIP으로 묶는다.
      - name: Package Shipping build
        if: github.ref_type == 'tag'
        shell: powershell
        run: |
          $ShippingDirectory = Resolve-Path "KnotEngine/Bin/x64/Shipping"
          $SafeTag = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          $PackagePath = Join-Path $env:RUNNER_TEMP "KnotEngine-Windows-x64-$SafeTag.zip"

          tar.exe -a -c -f $PackagePath --exclude="*.pdb" -C $ShippingDirectory .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RELEASE_PACKAGE=$PackagePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Annotated Tag의 설명을 본문으로 사용해 GitHub Release를 만들고 Shipping ZIP을 첨부한다.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "%GITHUB_REF_NAME%" "%RELEASE_PACKAGE%" --verify-tag --title "%GITHUB_REF_NAME%" --notes-from-tag
